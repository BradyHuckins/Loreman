<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Loremaster · A guided D&amp;D campaign builder</title>

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT@9..144,300..600,0..100&family=DM+Sans:opsz,wght@9..40,400..600&display=swap" rel="stylesheet">

  <!-- Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.5.0/dist/tabler-icons.min.css">

  <!-- App styles -->
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- App root — JS renders everything in here -->
  <div class="app-shell" id="app"></div>

  <!-- Dev tool: wipes local data and restarts onboarding -->
  <button class="dev-reset" onclick="resetApp()" title="Wipe local data and restart">
    <i class="ti ti-refresh" style="font-size: 12px; vertical-align: -1px; margin-right: 2px;"></i>Reset
  </button>

  <!-- Auto-save indicator -->
  <div class="saved-indicator" id="saved-indicator">
    <i class="ti ti-check" style="font-size: 11px; vertical-align: -1px;"></i> Saved
  </div>

  <!-- Modal mount point -->
  <div id="modal-mount"></div>


  <!-- =====================================================================
       JavaScript — load order matters. Do not rearrange.

       Supabase CDN  →  config  →  supabase client
       →  data  →  state  →  db  →  render  →  auth
       →  feature modules
       →  boot
       ===================================================================== -->

  <!-- 1. Supabase client library (exposes window.supabase) -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>

  <!-- 2. Your project URL + anon key — FILL THESE IN (see SETUP.md) -->
  <script src="js/config.js"></script>

  <!-- 3. Creates the global `sb` Supabase client -->
  <script src="js/supabase.js"></script>

  <!-- 4. Static data pools: tips, pitches, NPCs, hooks, factions, book colors -->
  <script src="js/data.js"></script>

  <!-- 5. State object, save/load, uid, esc, fmtDate and other utilities -->
  <script src="js/state.js"></script>

  <!-- 6. All Supabase read/write operations -->
  <script src="js/db.js"></script>

  <!-- 7. Render router + topbar + campaign switcher + user menu -->
  <script src="js/render.js"></script>

  <!-- 8. Auth screen, signIn, signUp, signOut, boot sequence -->
  <script src="js/auth.js"></script>

  <!-- 9. Feature modules (order within this group doesn't matter) -->
  <script src="js/onboarding.js"></script>
  <script src="js/campaigns.js"></script>
  <script src="js/dashboard.js"></script>
  <script src="js/npcs.js"></script>
  <script src="js/sessions.js"></script>
  <script src="js/threads.js"></script>
  <script src="js/tips.js"></script>
  <script src="js/settings.js"></script>

  <!-- 10. Boot: check session → load data → render first screen -->
  <script>
    boot();
  </script>

</body>
</html>
